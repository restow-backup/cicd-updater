        - schemaChanged
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
    JournalEvent:
      type: object
      properties:
        id:
          type: string
          pattern: ^\d{15}-\d{6}$
        at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        action:
          type: string
          enum:
            - update.scheduled
            - update.rescheduled
            - update.cancelled
            - update.abort_requested
            - update.started
            - update.succeeded
            - update.failed
            - update.acknowledged
        runId:
          type: string
        actor:
          type: object
          properties:
            id:
              anyOf:
                - type: string
                  maxLength: 200
                - type: "null"
            label:
              type: string
              maxLength: 200
            via:
              type: string
              enum:
                - api
                - cli
