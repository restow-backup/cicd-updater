            - label
            - via
        target:
          type: string
        details:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      required:
        - id
        - at
        - action
        - runId
        - actor
        - target
        - details
    Message:
      type: object
      properties:
        code:
          type: string
          maxLength: 100
        params:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type:
              - string
              - number
      required:
