    Step:
      type: object
      properties:
        id:
          type: string
          enum:
            - prepare
            - fetch
            - backup
            - stop
            - migrate
            - start
            - health
            - smoke
            - finish
        status:
          type: string
          enum:
            - pending
            - running
            - done
            - failed
            - skipped
        startedAt:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            - type: "null"
        finishedAt:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            - type: "null"
        detail:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type:
              - string
              - number
              - boolean
              - "null"
      required:
        - id
        - status
        - startedAt
        - finishedAt
        - detail
    VerificationResult:
      type: object
      properties:
        version:
          type: string
        release:
          type: object
          properties:
            sha256:
              anyOf:
                - type: string
                  pattern: ^[0-9a-f]{64}$
                - type: "null"
            document:
              type: string
              enum:
                - verified
                - not_checked
            channel:
              type: string
              enum:
                - stable
                - beta
            notesUrl:
              type:
                - string
                - "null"
            manualSteps:
              type: object
              properties:
                required:
                  type: boolean
                summary:
                  type:
                    - string
                    - "null"
                url:
                  type:
                    - string
                    - "null"
              required:
                - required
                - summary
                - url
            minimumFromVersion:
              type:
                - string
                - "null"
          required:
            - sha256
            - document
            - channel
            - notesUrl
            - manualSteps
            - minimumFromVersion
        refusals:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              ref:
                type: string
              signature:
                type: string
                enum:
                  - verified
                  - failed
                  - not_checked
              exists:
                type:
                  - boolean
                  - "null"
              error:
                type:
                  - string
                  - "null"
            required:
              - key
              - ref
              - signature
              - exists
              - error
        checkedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
      required:
        - version
        - release
        - refusals
        - images
        - checkedAt
    Warning:
      type: object
      properties:
        code:
          type: string
          description: "One of: trust_mode_none, updater_image_not_digest_pinned, self_label_missing, health_without_app_check, backup_none_with_probe, source_mode_enabled (more may be added in 1.x)."
        detail:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
      required:
        - code
        - detail
