          minimum: 0
        sha256:
          anyOf:
            - type: string
              pattern: ^[0-9a-f]{64}$
            - type: "null"
        type:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        runId:
          type:
            - string
            - "null"
        fromVersion:
          type:
            - string
            - "null"
        toVersion:
          type:
            - string
            - "null"
        verified:
          type: boolean
        encrypted:
          type: boolean
        protected:
          type: boolean
      required:
        - file
        - bytes
        - sha256
        - type
        - createdAt
        - runId
        - fromVersion
        - toVersion
        - verified
        - encrypted
        - protected
    BackupsView:
      type: object
      properties:
        backups:
          type: array
          items:
            $ref: "#/components/schemas/BackupInfo"
      required:
        - backups
    Blocker:
      type: object
      properties:
        code:
          type: string
          description: "One of: docker_unreachable, docker_too_old, compose_missing, compose_invalid, compose_unsupported, project_mismatch, env_unwritable, state_unwritable, disk_space, updater_image_unpinned, multiple_updaters, api_exposed, verifier_unavailable (more may be added in 1.x)."
        detail:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
      required:
        - code
        - detail
    Capabilities:
      type: object
      properties:
        ready:
          type: boolean
        blockers:
