    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
        errors:
