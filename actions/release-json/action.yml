name: cicd-updater release-json
description: >-
  Write release.json from the published index digests and the release policy, validate
  it, sign it (keyless, key or none) into release.json.sigstore.json, verify the
  signature once, and upload both (plus extra files) to the release, which is published last.
author: IT Systeme Flores UG (haftungsbeschränkt)

inputs:
  images:
    description: The images output of the publish action.
    required: true
  version:
    description: Plain release version; empty means derived from the pushed tag through tag-pattern.
    default: ""
  tag:
    description: Git tag of the release; empty means the pushed tag.
    default: ""
  tag-pattern:
    description: How a version maps to a Git tag; must match the sidecar's release.tagPattern.
    default: v{version}
  policy-file:
    description: The release policy (minimumFromVersion, requiresUpdater, requiresEnv, manualSteps).
    default: .cicd-updater/release-policy.yaml
  notes-url:
    description: Release notes URL; empty means the release page on GitHub, none elsewhere.
    default: ""
  signing:
    description: keyless, key or none. Empty means keyless on github.com; required elsewhere.
    default: ""
  cosign-key:
    description: key mode - the PEM private key (from a secret) or a KMS URI cosign supports.
    default: ""
  cosign-password:
    description: key mode - the password of the private key.
    default: ""
  transparency-log:
    description: key mode - also upload the signature to the public transparency log.
    default: "false"
  cosign-version:
    description: cosign release to install; keep it on the minor version of the sidecar image.
    default: v3.1.3
  release-host:
    description: github, gitea (also Forgejo), gitlab or none. Empty means github on github.com; required elsewhere.
    default: ""
  api-url:
    description: API base of the release host (Forgejo/Gitea/GitLab base URL; GitHub's default otherwise).
    default: ""
  repository:
    description: owner/repo (GitLab - group/project) on the release host; empty means this repository.
    default: ""
  token:
    description: Token with write access to the releases of the repository.
    default: ${{ github.token }}
  publish-release:
    description: Publish the release after the upload (false leaves a draft).
    default: "true"
  release-name:
    description: Title of the release; empty means the tag.
    default: ""
  notes-file:
    description: Markdown file with the release text.
    default: ""
  extra-files:
    description: More files to attach, one path per line (for example SBOMs or archives).
    default: ""
  checksums:
    description: Also write SHA256SUMS over every asset and sign it like release.json.
    default: "false"
  workflow:
    description: keyless self-check - the workflow file that signs (.github/workflows/release.yml); empty means the running one.
    default: ""

outputs:
  path:
    description: Path of release.json.
    value: ${{ steps.create.outputs.path }}
  sha256:
    description: SHA-256 of release.json (what an admin compares before scheduling).
    value: ${{ steps.create.outputs.sha256 }}
  url:
    description: URL of the release.
    value: ${{ steps.upload.outputs.url }}

runs:
  using: composite
  steps:
    - name: Node.js for the release tools
      id: node
      shell: bash
      run: |
        if command -v node > /dev/null 2>&1 && [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 22 ]; then
          echo "setup=false" >> "$GITHUB_OUTPUT"
        else
          echo "setup=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js 22
      if: steps.node.outputs.setup == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - name: Mode, version and release host
      id: prep
      shell: bash
      env:
        RELEASE_TOOLS: ${{ github.action_path }}/../lib/release-tools.mjs
        SIGNING: ${{ inputs.signing }}
        COSIGN_KEY: ${{ inputs.cosign-key }}
        VERSION: ${{ inputs.version }}
        TAG: ${{ inputs.tag }}
        TAG_PATTERN: ${{ inputs.tag-pattern }}
        RELEASE_HOST: ${{ inputs.release-host }}
        NOTES_URL: ${{ inputs.notes-url }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        on_github=false
        if [ "${GITHUB_SERVER_URL:-}" = "https://github.com" ]; then on_github=true; fi
        mode="$SIGNING"
        if [ -z "$mode" ]; then
          if [ "$on_github" = true ]; then
            mode=keyless
          else
            echo "::error::Input signing is required outside github.com (keyless, key or none)."
            exit 1
          fi
        fi
        case "$mode" in
          keyless | none) ;;
          key)
            if [ -z "$COSIGN_KEY" ]; then
              echo "::error::signing: key needs the input cosign-key."
              exit 1
            fi
            ;;
          *)
            echo "::error::signing must be keyless, key or none."
            exit 1
            ;;
        esac
        if [ -z "$RELEASE_HOST" ]; then
          if [ "$on_github" = true ]; then
            RELEASE_HOST=github
          else
            echo "::error::Input release-host is required outside github.com (github, gitea, gitlab or none)."
            exit 1
          fi
        fi
        case "$RELEASE_HOST" in
          github | gitea | gitlab | none) ;;
          *)
            echo "::error::release-host must be github, gitea, gitlab or none."
            exit 1
            ;;
        esac
        if [ -z "$TAG" ]; then
          if [ -n "$VERSION" ]; then TAG="${TAG_PATTERN/\{version\}/$VERSION}"; else TAG="$GITHUB_REF_NAME"; fi
        fi
        node "$RELEASE_TOOLS" version --tag "$TAG" --tag-pattern "$TAG_PATTERN" --github-output "$GITHUB_OUTPUT" > /dev/null
        derived="$(node "$RELEASE_TOOLS" version --tag "$TAG" --tag-pattern "$TAG_PATTERN" --github-output /dev/null | sed -n 's/^version=//p')"
        if [ -n "$VERSION" ] && [ "$VERSION" != "$derived" ]; then
          echo "::error::version $VERSION does not render to tag $TAG through $TAG_PATTERN."
          exit 1
        fi
        if [ -z "$NOTES_URL" ] && [ "$on_github" = true ]; then
          NOTES_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
        fi
        dir="$RUNNER_TEMP/cicd-updater-release"
        rm -rf "$dir"
        mkdir -p "$dir"
        {
          echo "mode=$mode"
          echo "host=$RELEASE_HOST"
          echo "tag=$TAG"
          echo "notes-url=$NOTES_URL"
          echo "repository=${REPOSITORY:-$GITHUB_REPOSITORY}"
          echo "dir=$dir"
        } >> "$GITHUB_OUTPUT"

    - name: Install cosign
      if: steps.prep.outputs.mode != 'none'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Create and validate release.json
      id: create
      shell: bash
      env:
        RELEASE_TOOLS: ${{ github.action_path }}/../lib/release-tools.mjs
        IMAGES: ${{ inputs.images }}
        VERSION: ${{ steps.prep.outputs.version }}
        TAG: ${{ steps.prep.outputs.tag }}
        TAG_PATTERN: ${{ inputs.tag-pattern }}
        POLICY_FILE: ${{ inputs.policy-file }}
        NOTES_URL: ${{ steps.prep.outputs.notes-url }}
        MODE: ${{ steps.prep.outputs.mode }}
        DIR: ${{ steps.prep.outputs.dir }}
      run: |
        set -euo pipefail
        args=(json create --images "$IMAGES" --version "$VERSION" --tag "$TAG" --tag-pattern "$TAG_PATTERN"
          --signing "$MODE" --out "$DIR/release.json")
        if [ -f "$POLICY_FILE" ]; then
          args+=(--policy-file "$POLICY_FILE")
        else
          echo "::notice::$POLICY_FILE does not exist; the release has no upgrade constraints."
        fi
        if [ -n "$NOTES_URL" ]; then args+=(--notes-url "$NOTES_URL"); fi
        node "$RELEASE_TOOLS" "${args[@]}"
        node "$RELEASE_TOOLS" json validate --file "$DIR/release.json" --tag "$TAG"

    - name: Signing key
      id: key
      if: steps.prep.outputs.mode == 'key'
      shell: bash
      env:
        COSIGN_KEY: ${{ inputs.cosign-key }}
      run: |
        set -euo pipefail
        umask 077
        case "$COSIGN_KEY" in
          *"-----BEGIN"*)
            file="$RUNNER_TEMP/cicd-updater-cosign.key"
            printf '%s\n' "$COSIGN_KEY" > "$file"
            echo "ref=$file" >> "$GITHUB_OUTPUT"
            ;;
          *://*)
            echo "ref=$COSIGN_KEY" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::cosign-key must be a PEM private key or a KMS URI."
            exit 1
            ;;
        esac

    - name: Sign and verify release.json
      if: steps.prep.outputs.mode != 'none'
      shell: bash
      env:
        RELEASE_TOOLS: ${{ github.action_path }}/../lib/release-tools.mjs
        MODE: ${{ steps.prep.outputs.mode }}
        KEY_REF: ${{ steps.key.outputs.ref }}
        TRANSPARENCY_LOG: ${{ inputs.transparency-log }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
        WORKFLOW: ${{ inputs.workflow }}
        DIR: ${{ steps.prep.outputs.dir }}
      run: |
        set -euo pipefail
        sign=(json sign --file "$DIR/release.json" --bundle "$DIR/release.json.sigstore.json" --signing "$MODE" --github-output /dev/null)
        if [ "$MODE" = key ]; then sign+=(--key "$KEY_REF"); fi
        if [ "$TRANSPARENCY_LOG" = "true" ]; then sign+=(--transparency-log); fi
        node "$RELEASE_TOOLS" "${sign[@]}"
        # Verify once, the way the sidecar will, before anything is published.
        if [ "$MODE" = key ]; then
          cosign public-key --key "$KEY_REF" > "$DIR/.cosign.pub"
          verify=(json verify --file "$DIR/release.json" --bundle "$DIR/release.json.sigstore.json" --public-key "$DIR/.cosign.pub")
          if [ "$TRANSPARENCY_LOG" = "true" ]; then verify+=(--transparency-log); fi
          node "$RELEASE_TOOLS" "${verify[@]}"
          rm -f "$DIR/.cosign.pub"
        elif [ "${GITHUB_SERVER_URL:-}" = "https://github.com" ]; then
          if [ -z "$WORKFLOW" ]; then
            WORKFLOW="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"
            WORKFLOW="${WORKFLOW%%@*}"
          fi
          node "$RELEASE_TOOLS" json verify --file "$DIR/release.json" --bundle "$DIR/release.json.sigstore.json" \
            --github-repository "$GITHUB_REPOSITORY" --workflow "$WORKFLOW"
        else
          echo "::notice::keyless self-check skipped outside github.com; verify with the sidecar's identity before announcing the release."
        fi

    - name: Checksums
      if: inputs.checksums == 'true'
      shell: bash
      env:
        RELEASE_TOOLS: ${{ github.action_path }}/../lib/release-tools.mjs
        EXTRA_FILES: ${{ inputs.extra-files }}
        MODE: ${{ steps.prep.outputs.mode }}
        KEY_REF: ${{ steps.key.outputs.ref }}
        TRANSPARENCY_LOG: ${{ inputs.transparency-log }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
        DIR: ${{ steps.prep.outputs.dir }}
      run: |
        set -euo pipefail
        while IFS= read -r file; do
          if [ -n "$file" ]; then cp -- "$file" "$DIR/"; fi
        done <<< "$EXTRA_FILES"
        (cd "$DIR" && sha256sum -- * > SHA256SUMS)
        cat "$DIR/SHA256SUMS"
        sign=(json sign --file "$DIR/SHA256SUMS" --bundle "$DIR/SHA256SUMS.sigstore.json" --signing "$MODE" --github-output /dev/null)
        if [ "$MODE" = key ]; then sign+=(--key "$KEY_REF"); fi
        if [ "$TRANSPARENCY_LOG" = "true" ]; then sign+=(--transparency-log); fi
        node "$RELEASE_TOOLS" "${sign[@]}"

    - name: Remove the key file
      if: always() && steps.prep.outputs.mode == 'key'
      shell: bash
      run: rm -f "$RUNNER_TEMP/cicd-updater-cosign.key"

    - name: Upload and publish the release
      id: upload
      if: steps.prep.outputs.host != 'none'
      shell: bash
      env:
        RELEASE_TOOLS: ${{ github.action_path }}/../lib/release-tools.mjs
        HOST: ${{ steps.prep.outputs.host }}
        API_URL: ${{ inputs.api-url }}
        REPOSITORY: ${{ steps.prep.outputs.repository }}
        TAG: ${{ steps.prep.outputs.tag }}
        PRERELEASE: ${{ steps.prep.outputs.prerelease }}
        RELEASE_TOKEN: ${{ inputs.token }}
        PUBLISH: ${{ inputs.publish-release }}
        RELEASE_NAME: ${{ inputs.release-name }}
        NOTES_FILE: ${{ inputs.notes-file }}
        EXTRA_FILES: ${{ inputs.extra-files }}
        CHECKSUMS: ${{ inputs.checksums }}
        DIR: ${{ steps.prep.outputs.dir }}
      run: |
        set -euo pipefail
        files=()
        if [ "$CHECKSUMS" = "true" ]; then
          for file in "$DIR"/*; do files+=("$file"); done
        else
          for file in "$DIR"/release.json "$DIR"/release.json.sigstore.json; do
            if [ -f "$file" ]; then files+=("$file"); fi
          done
          while IFS= read -r file; do
            if [ -n "$file" ]; then files+=("$file"); fi
          done <<< "$EXTRA_FILES"
        fi
        list="$(IFS=,; printf '%s' "${files[*]}")"
        args=(upload --host "$HOST" --repository "$REPOSITORY" --tag "$TAG" --files "$list"
          --name "${RELEASE_NAME:-$TAG}")
        if [ -n "$API_URL" ]; then args+=(--api-url "$API_URL"); fi
        if [ -n "$NOTES_FILE" ]; then args+=(--notes-file "$NOTES_FILE"); fi
        if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
        if [ "$PUBLISH" != "true" ]; then args+=(--draft); fi
        node "$RELEASE_TOOLS" "${args[@]}"

    - name: Summary
      shell: bash
      env:
        DIR: ${{ steps.prep.outputs.dir }}
        SHA256: ${{ steps.create.outputs.sha256 }}
        MODE: ${{ steps.prep.outputs.mode }}
      run: |
        {
          echo "### release.json (signing: $MODE)"
          echo
          echo "SHA-256: \`$SHA256\`"
          echo
          echo '```json'
          cat "$DIR/release.json"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
