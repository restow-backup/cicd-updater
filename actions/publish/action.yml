name: cicd-updater publish
description: >-
  After the smoke test passed: create and tag one multi-arch index per image from the
  pushed platform digests, sign each index (keyless, key or none) and attach an SPDX
  SBOM per platform image. A version tag that already holds other content is refused.
author: IT Systeme Flores UG (haftungsbeschränkt)

inputs:
  images:
    description: 'JSON {"<key>": {"repository": "...", "digests": ["sha256:...", ...]}}: the platform digests of the build.'
    required: true
  version:
    description: Plain release version (the image tag); empty means derived from the pushed tag through tag-pattern.
    default: ""
  tag-pattern:
    description: How a version maps to a Git tag; must match the sidecar's release.tagPattern.
    default: v{version}
  extra-tags:
    description: Comma-separated moving tags (for example 1,latest); never checked for immutability.
    default: ""
  signing:
    description: keyless, key or none. Empty means keyless on github.com; required elsewhere.
    default: ""
  cosign-key:
    description: key mode - the PEM private key (from a secret) or a KMS URI cosign supports.
    default: ""
  cosign-password:
    description: key mode - the password of the private key.
    default: ""
  transparency-log:
    description: key mode - also upload the signatures to the public transparency log.
    default: "false"
  sbom:
    description: Generate an SPDX SBOM per platform image with syft and attach it as attestation.
    default: "true"
  refuse-existing:
    description: Refuse when the version tag already exists with other content.
    default: "true"
  cosign-version:
    description: cosign release to install; keep it on the minor version of the sidecar image.
    default: v3.1.3
  registry:
    description: Registry to log in to; empty skips the login.
    default: ""
  username:
    description: Registry user; empty means the workflow's actor.
    default: ""
  password:
    description: Registry password or token.
    default: ""

outputs:
  images:
    description: 'JSON {"<key>": {"repository", "tag", "digest", "platforms"}} with the index digests (input of release-json).'
    value: ${{ steps.index.outputs.images }}
  signing:
    description: The signing mode used.
    value: ${{ steps.mode.outputs.mode }}
  sbom-files:
    description: Newline-separated paths of the SBOM files.
    value: ${{ steps.sbom.outputs.files }}

runs:
  using: composite
  steps:
    - name: Node.js for the release tools
      id: node
      shell: bash
      run: |
        if command -v node > /dev/null 2>&1 && [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 22 ]; then
          echo "setup=false" >> "$GITHUB_OUTPUT"
        else
          echo "setup=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js 22
      if: steps.node.outputs.setup == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - name: Signing mode and version
      id: mode
      shell: bash
      env:
        RELEASE_TOOLS: ${{ github.action_path }}/../lib/release-tools.mjs
        SIGNING: ${{ inputs.signing }}
        COSIGN_KEY: ${{ inputs.cosign-key }}
        VERSION: ${{ inputs.version }}
        TAG_PATTERN: ${{ inputs.tag-pattern }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ]; then tag="${TAG_PATTERN/\{version\}/$VERSION}"; else tag="$GITHUB_REF_NAME"; fi
        node "$RELEASE_TOOLS" version --tag "$tag" --tag-pattern "$TAG_PATTERN" --github-output "$GITHUB_OUTPUT" > /dev/null
        mode="$SIGNING"
        if [ -z "$mode" ]; then
          if [ "${GITHUB_SERVER_URL:-}" = "https://github.com" ]; then
            mode=keyless
          else
            echo "::error::Input signing is required outside github.com (keyless, key or none)."
            exit 1
          fi
        fi
        case "$mode" in
          keyless | none) ;;
          key)
            if [ -z "$COSIGN_KEY" ]; then
              echo "::error::signing: key needs the input cosign-key."
              exit 1
            fi
            ;;
          *)
            echo "::error::signing must be keyless, key or none."
            exit 1
            ;;
        esac
        echo "mode=$mode" >> "$GITHUB_OUTPUT"

    - name: Log in to the registry
      if: inputs.password != '' && inputs.registry != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username || github.actor }}
        password: ${{ inputs.password }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Create and tag the indexes
      id: index
      shell: bash
      env:
        RELEASE_TOOLS: ${{ github.action_path }}/../lib/release-tools.mjs
        IMAGES: ${{ inputs.images }}
        VERSION: ${{ steps.mode.outputs.version }}
        EXTRA_TAGS: ${{ inputs.extra-tags }}
        REFUSE_EXISTING: ${{ inputs.refuse-existing }}
      run: |
        set -euo pipefail
        args=(index --images "$IMAGES" --version "$VERSION" --extra-tags "$EXTRA_TAGS")
        if [ "$REFUSE_EXISTING" != "true" ]; then args+=(--allow-existing); fi
        node "$RELEASE_TOOLS" "${args[@]}"

    - name: Install cosign
      if: steps.mode.outputs.mode != 'none'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Signing key
      id: key
      if: steps.mode.outputs.mode == 'key'
      shell: bash
      env:
        COSIGN_KEY: ${{ inputs.cosign-key }}
      run: |
        set -euo pipefail
        umask 077
        case "$COSIGN_KEY" in
          *"-----BEGIN"*)
            file="$RUNNER_TEMP/cicd-updater-cosign.key"
            printf '%s\n' "$COSIGN_KEY" > "$file"
            echo "ref=$file" >> "$GITHUB_OUTPUT"
            ;;
          *://*)
            echo "ref=$COSIGN_KEY" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::cosign-key must be a PEM private key or a KMS URI."
            exit 1
            ;;
        esac

    - name: Sign the indexes
      shell: bash
      env:
        RELEASE_TOOLS: ${{ github.action_path }}/../lib/release-tools.mjs
        PUBLISHED: ${{ steps.index.outputs.images }}
        MODE: ${{ steps.mode.outputs.mode }}
        KEY_REF: ${{ steps.key.outputs.ref }}
        TRANSPARENCY_LOG: ${{ inputs.transparency-log }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
      run: |
        set -euo pipefail
        args=(sign-images --images "$PUBLISHED" --signing "$MODE")
        if [ "$MODE" = key ]; then args+=(--key "$KEY_REF"); fi
        if [ "$TRANSPARENCY_LOG" = "true" ]; then args+=(--transparency-log); fi
        node "$RELEASE_TOOLS" "${args[@]}"

    - name: Install syft
      if: inputs.sbom == 'true'
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

    - name: SBOM per platform image
      id: sbom
      if: inputs.sbom == 'true'
      shell: bash
      env:
        RELEASE_TOOLS: ${{ github.action_path }}/../lib/release-tools.mjs
        PUBLISHED: ${{ steps.index.outputs.images }}
        MODE: ${{ steps.mode.outputs.mode }}
        KEY_REF: ${{ steps.key.outputs.ref }}
        TRANSPARENCY_LOG: ${{ inputs.transparency-log }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
      run: |
        set -euo pipefail
        args=(sbom --images "$PUBLISHED" --signing "$MODE" --out-dir "$RUNNER_TEMP/cicd-updater-sbom")
        if [ "$MODE" = key ]; then args+=(--key "$KEY_REF"); fi
        if [ "$TRANSPARENCY_LOG" = "true" ]; then args+=(--transparency-log); fi
        node "$RELEASE_TOOLS" "${args[@]}"

    - name: Remove the key file
      if: always() && steps.mode.outputs.mode == 'key'
      shell: bash
      run: rm -f "$RUNNER_TEMP/cicd-updater-cosign.key"

    - name: Summary
      shell: bash
      env:
        PUBLISHED: ${{ steps.index.outputs.images }}
        MODE: ${{ steps.mode.outputs.mode }}
      run: |
        {
          echo "### Published images (signing: $MODE)"
          echo
          node -e 'for (const [k, i] of Object.entries(JSON.parse(process.env.PUBLISHED))) console.log(`- ${k}: \`${i.repository}:${i.tag}@${i.digest}\` (${i.platforms.join(", ")})`)'
        } >> "$GITHUB_STEP_SUMMARY"
