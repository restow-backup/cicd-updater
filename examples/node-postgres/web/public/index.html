<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; }
      .banner[data-state="scheduled"], .banner[data-state="running"] { background: #fef3c7; padding: 0.75rem; }
      .banner[data-state="failed"] { background: #fee2e2; padding: 0.75rem; }
      .banner[data-state="succeeded"] { background: #dcfce7; padding: 0.75rem; }
      [data-part="bar"] { background: #e5e7eb; height: 0.5rem; }
      [data-part="fill"] { background: #2563eb; height: 100%; }
      .update-form { display: grid; gap: 0.5rem; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <h1>Notes</h1>
    <div id="root"></div>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
