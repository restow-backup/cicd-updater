# cicd-updater configuration of the Notes example (docs/configuration.md).
# compose.projectDir comes from CICD_UPDATER_COMPOSE__PROJECT_DIR (docker-compose.yml).
version: 1

compose:
  profiles: [updater]

auth:
  # The api runs as the node user (gid 1000); the token file is root:1000, mode 0640.
  tokenGroupId: 1000

release:
  feed:
    type: github
    url: https://github.com/acme/notes
  channel: stable

trust:
  mode: keyless
  keyless:
    github:
      repository: acme/notes
      workflow: .github/workflows/release.yml

services:
  - { name: api, image: app, imageVar: APP_IMAGE, startOrder: 1 }
  - { name: worker, image: app, imageVar: APP_IMAGE, startOrder: 2 }
  - { name: web, image: web, imageVar: WEB_IMAGE, startOrder: 3, stopBeforeUpdate: false }

hooks:
  backup:
    type: postgres
    service: db
  migrationProbe:
    type: postgres
    service: db
    preset: node-pg-migrate
    fingerprint: true
  migrate:
    service: api
    argv: ["npm", "run", "--silent", "migrate"]
  health:
    type: http
    http:
      url: http://api:3000/healthz
      sendToken: true # the app reveals its version only to the updater
      versionJsonPath: $.version
  smoke:
    checks:
      - { type: http, url: http://web:8080/, expectStatus: [200] }
      - { type: http, url: http://web:8080/api/ping, expectStatus: [200], bodyContains: pong }

rollback:
  policy: probe

publicStatus:
  enabled: true

maintenancePage:
  enabled: true
