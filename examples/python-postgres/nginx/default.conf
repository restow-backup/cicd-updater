# The FastNotes edge. While the API is down during an update, requests get the
# updater's maintenance page instead of a bare 502; the page polls the public status
# through this edge and reloads when the new version answers (docs/maintenance-page.md).
#
# The upstreams are variables, resolved per request through Docker's DNS, so nginx
# starts even when the API is being replaced or the updater profile is off.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    set $api http://api:8000;
    set $updater http://updater:8090;

    # The updater's public status and maintenance page (no token, no versions).
    location /public/v1/ {
        proxy_pass $updater;
    }

    location / {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 502 503 504 = @maintenance;
    }

    location @maintenance {
        rewrite ^ /public/v1/maintenance/ break;
        proxy_pass $updater;
    }
}
