# Release workflow for an app updated by cicd-updater (GitHub Actions, keyless signing).
#
# Copy to .github/workflows/release.yml and adjust the lines marked "ADJUST". It runs
# when a tag v* is pushed:
#
#   build (one job per architecture, native runners): build every image, push by digest
#     without a tag, smoke-test the digests on that architecture
#   release (after both builds and smokes passed): tag and sign the multi-arch indexes,
#     attach SBOMs, write and sign release.json, upload it and publish the release
#
# Nothing is tagged in the registry and no release is public before the smoke tests
# passed. The sidecar verifies the signatures with the identity of THIS file at the
# release tag (trust.keyless.github in updater.yaml: repository and
# workflow: .github/workflows/release.yml), so keep the file name.
#
# Pin the cicd-updater actions to the commit SHA of the release you reviewed
# (the tag is shown for readability); Dependabot keeps the pin current.

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ADJUST: one repository per image key of release.json (lowercase). Do not name these
  # like the image variables of your Compose file (APP_IMAGE): those carry digests.
  APP_REPOSITORY: ghcr.io/acme/notes

jobs:
  build:
    name: Build and smoke ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the app image
        id: app
        uses: restow-backup/cicd-updater/actions/build@v1.0.0
        with:
          image: ${{ env.APP_REPOSITORY }}
          platforms: ${{ matrix.platform }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ADJUST: one build step per further image (for example a web edge).

      - name: Smoke test
        uses: restow-backup/cicd-updater/actions/smoke@v1.0.0
        with:
          compose-files: docker-compose.yml,docker-compose.smoke.yml # ADJUST
          images: '{"app": {"repository": "${{ env.APP_REPOSITORY }}", "digest": "${{ steps.app.outputs.digest }}"}}'
          image-vars: '{"app": "APP_IMAGE"}' # ADJUST: the env key the Compose file reads
          health-url: http://127.0.0.1:3000/healthz # ADJUST: published by the smoke override
          # No health-version-path by default: an app that reveals its version only to the
          # sidecar's token (recommended, docs/app-integration.md) cannot be version-checked
          # by the runner, which has no token. The sidecar checks the version on the host.
          # If your health endpoint shows the version to anyone, enable the check:
          # health-version-path: $.version
          upgrade-from: previous
          # Throwaway values for variables your Compose file requires (${VAR:?}).
          # env: |
          #   POSTGRES_PASSWORD=smoke-${{ github.run_id }}

      - name: Keep the digest
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s' "$APP_DIGEST" > "digests/app-$ARCH"

      - name: Upload the digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      packages: write # tags, signatures and SBOM attestations
      id-token: write # keyless signing with the workflow's OIDC identity
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: The platform digests per image
        id: digests
        run: |
          printf 'images={"app": {"repository": "%s", "digests": ["%s", "%s"]}}\n' \
            "$APP_REPOSITORY" "$(cat digests/app-amd64)" "$(cat digests/app-arm64)" >> "$GITHUB_OUTPUT"

      - name: Tag, sign and attach SBOMs
        id: publish
        uses: restow-backup/cicd-updater/actions/publish@v1.0.0
        with:
          images: ${{ steps.digests.outputs.images }}
          signing: keyless
          registry: ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: release.json and the release
        uses: restow-backup/cicd-updater/actions/release-json@v1.0.0
        with:
          images: ${{ steps.publish.outputs.images }}
          signing: keyless
          release-host: github
